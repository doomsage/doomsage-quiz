<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Doomsage Quiz</title>
<style>
:root{--gold:#D4AF37;--cream:#F8F8D4;--bg:#000;--card:#111;--line:#2a2a22;--ok:#2ecc71;--bad:#ff5252}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--cream);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100%}
body{background:radial-gradient(120% 60% at 50% -10%,#2a220a 0%,#000 60%) no-repeat,#000;min-height:100vh}
#app{max-width:560px;margin:0 auto;padding:20px 18px calc(90px + env(safe-area-inset-bottom))}
.brand{display:flex;align-items:center;gap:10px;letter-spacing:.25em;font-size:12px;color:var(--gold);font-weight:700;margin-bottom:26px}
.brand i{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold)}
h1{font-size:30px;margin:0 0 6px;line-height:1.15}
.sub{color:#a9a98a;margin:0 0 24px;font-size:15px}
.view{animation:in .35s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.set{display:block;width:100%;text-align:left;background:linear-gradient(145deg,#1a1608,#0d0d0d);border:1px solid var(--line);border-radius:18px;padding:18px;color:inherit;font:inherit;cursor:pointer;transition:transform .15s,border-color .2s}
.set:active{transform:scale(.98);border-color:var(--gold)}
.set b{font-size:19px;display:block;margin:8px 0 2px}.set span{color:#a9a98a;font-size:14px}
.tag{display:inline-block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#000;background:var(--gold);padding:3px 9px;border-radius:99px;font-weight:700}
.go{float:right;color:var(--gold);font-size:22px;margin-top:-34px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.x{background:none;border:1px solid var(--line);color:var(--cream);width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer}
.bar{flex:1;height:6px;background:#1c1c16;border-radius:9px;overflow:hidden}
.bar div{height:100%;background:linear-gradient(90deg,#8a6d12,var(--gold));border-radius:9px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.cnt{font-size:13px;color:var(--gold);font-weight:700;min-width:42px;text-align:right}
.badge{display:inline-block;font-size:12px;color:var(--gold);border:1px solid #5a4912;background:#17130400;padding:4px 10px;border-radius:99px;margin-bottom:14px}
.q{font-size:18px;line-height:1.5;margin:0 0 20px;white-space:pre-line}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);color:var(--cream);font:inherit;font-size:16px;line-height:1.4;padding:14px;border-radius:14px;margin-bottom:10px;cursor:pointer;transition:transform .12s,border-color .2s,background .25s}
.opt:active:not(:disabled){transform:scale(.98)}
.opt em{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid #5a5a40;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;color:var(--gold)}
.opt:disabled{cursor:default;color:#8a8a72}
.opt.ok{background:#0c2a18;border-color:var(--ok);color:#eafff2;animation:pop .4s}
.opt.ok em{background:var(--ok);border-color:var(--ok);color:#000}
.opt.bad{background:#2c0e0e;border-color:var(--bad);color:#ffeaea;animation:shake .4s}
.opt.bad em{background:var(--bad);border-color:var(--bad);color:#000}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.exp{background:#14110a;border-left:3px solid var(--gold);border-radius:6px 12px 12px 6px;padding:12px 14px;font-size:14.5px;line-height:1.5;margin-top:14px;animation:in .35s}
.exp b{color:var(--gold)}
.foot{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#000 40%)}
.btn{display:block;width:100%;max-width:524px;margin:0 auto;background:var(--gold);color:#000;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800;cursor:pointer;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.97)}.btn.ghost{background:none;color:var(--gold);border:1px solid var(--gold);margin-top:10px}
.ring{width:170px;height:170px;margin:10px auto 14px;position:relative}
.ring svg{transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:10}
.ring .t{stroke:#1c1c16}.ring .p{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.ring div{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;font-weight:800}
.msg{text-align:center;color:#a9a98a;margin:0 0 22px}
.rv{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;margin-bottom:8px;font-size:14px;line-height:1.4;cursor:pointer}
.rv .d{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#000}
.rv.ok .d{background:var(--ok)}.rv.bad .d{background:var(--bad)}
.rv small{color:#8a8a72;display:block;margin-top:3px}
.rv .more{display:none;margin-top:8px;color:#cfcfae}.rv.open .more{display:block}
.rv .more p{margin:4px 0}
.qi{display:block;max-width:100%;max-height:260px;margin:0 auto 16px;background:#fff;border-radius:12px;padding:6px;cursor:zoom-in}
.oi{display:block;max-width:100%;max-height:150px;background:#fff;border-radius:8px;padding:3px;margin-top:2px}
#zm{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:9;padding:14px}
#zm img{max-width:100%;max-height:100%;background:#fff;border-radius:10px;padding:8px}
.set{margin-bottom:12px}.cw{position:relative;margin-bottom:12px}.cw .set{margin:0}.pill{position:absolute;top:14px;right:14px;background:none;border:1px solid #5a4912;color:var(--gold);border-radius:99px;padding:5px 11px;font-size:12px;font-weight:700;cursor:pointer;z-index:2}.pill.on{background:var(--gold);color:#000;border-color:var(--gold)}.pill:disabled{opacity:.7}
.sw{font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;color:#000;background:var(--gold);border-radius:99px;padding:4px 10px;min-width:52px;text-align:center}.sw.done{background:#3a3a2a;color:var(--cream)}.sj{margin-bottom:12px}.sjh{display:flex;justify-content:space-between;gap:8px;font-size:14px}.sjh span{color:#a9a98a;font-size:12px}.sjb{height:6px;background:#3a1414;border-radius:9px;overflow:hidden;margin-top:5px}.sjb div{height:100%;background:var(--ok)}
.qa{display:flex;flex-direction:column;min-height:calc(100vh - 230px)}.qa.inv .qblk{order:2;margin-top:auto;padding-top:18px}.qa.inv .oblk{order:1}
.credit{.stat{display:flex;gap:10px;margin:16px 0}.stat div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}.stat b{font-size:22px;display:block}.stat span{font-size:11px;color:#a9a98a;letter-spacing:.08em;text-transform:uppercase}.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}.chip{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:4px 10px;color:#a9a98a}
text-align:center;font-size:11px;letter-spacing:.3em;color:#8a6f1c;margin-top:34px}
</style></head><body><div id="app"></div><div id="zm"><img alt=""></div>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const idb={db:null,open(){return new Promise((res,rej)=>{if(this.db)return res(this.db);const r=indexedDB.open('doomsage-quiz',2);r.onupgradeneeded=()=>{const d=r.result;['pdfs','quizzes'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n)})};r.onsuccess=()=>{this.db=r.result;res(r.result)};r.onerror=()=>rej(r.error)})},
put(id,blob,st){return this.open().then(db=>new Promise((res,rej)=>{const tx=db.transaction(st||'pdfs','readwrite');tx.objectStore(st||'pdfs').put(blob,id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)}))},
get(id,st){return this.open().then(db=>new Promise((res,rej)=>{const rq=db.transaction(st||'pdfs').objectStore(st||'pdfs').get(id);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error)}))},
del(id,st){return this.open().then(db=>new Promise((res,rej)=>{const tx=db.transaction(st,'readwrite');tx.objectStore(st).delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)}))},
all(st){return this.open().then(db=>new Promise((res,rej)=>{const rq=db.transaction(st).objectStore(st).getAll();rq.onsuccess=()=>res(rq.result||[]);rq.onerror=()=>rej(rq.error)}))}};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
async function offlineReady(){
  try{await navigator.serviceWorker.ready}catch(e){}
  const need=['index.html','convert.html','https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js','https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js','https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'];
  for(const u of need){if(!(await caches.match(u,{ignoreSearch:true})))return false}return true;
}
const L=['A','B','C','D'];
let inv=false;try{inv=localStorage.getItem('dq-inv')==='1'}catch(e){}
let times=[],qStart=0,tick=null;
function fmtSw(ms){const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function fmtT(ms){if(!ms||ms<0)return '0s';const s=Math.round(ms/1000);if(s<60)return s+'s';return Math.floor(s/60)+'m '+(s%60)+'s'}
function startQ(){qStart=Date.now();clearInterval(tick);tick=setInterval(()=>{const e=document.getElementById('sw');if(e)e.textContent=fmtSw(Date.now()-qStart)},250)}
function stopQ(){times[i]=Date.now()-qStart;clearInterval(tick);const e=document.getElementById('sw');if(e){e.textContent=fmtSw(times[i]);e.classList.add('done')}}
function report(okOf){
  const qs=set.questions,n=qs.length;const subj={};
  qs.forEach((q,j)=>{const k=String(q.badge).split(' - ')[0];const o=subj[k]||(subj[k]={t:0,c:0,ms:0});o.t++;if(okOf(j))o.c++;o.ms+=times[j]||0});
  const wrong=qs.map((_,j)=>j).filter(j=>!okOf(j));const c=n-wrong.length;
  const tot=times.reduce((a,b)=>a+(b||0),0);
  let slow=-1;times.forEach((t,j)=>{if(slow<0||t>times[slow])slow=j});
  return `<div class="stat"><div><b style="color:var(--ok)">${c}</b><span>Correct</span></div><div><b style="color:var(--bad)">${wrong.length}</b><span>Wrong</span></div><div><b>${Math.round(c/n*100)}%</b><span>Accuracy</span></div></div>
  <p class="msg" style="font-size:13px;margin:-6px 0 18px">Total ${fmtT(tot)} · avg ${fmtT(tot/n)} per question${slow>=0&&times[slow]?` · slowest Q${slow+1} (${fmtT(times[slow])})`:''}</p>
  <h1 style="font-size:16px;letter-spacing:.14em;color:var(--gold);margin:6px 0 10px">BY SUBJECT</h1>`+
  Object.entries(subj).map(([k,o])=>`<div class="sj"><div class="sjh"><b>${esc(k)}</b><span>${o.c}/${o.t} correct · ${o.t-o.c} wrong · avg ${fmtT(o.ms/o.t)}</span></div><div class="sjb"><div style="width:${o.c/o.t*100}%"></div></div></div>`).join('')+
  `<h1 style="font-size:16px;letter-spacing:.14em;color:var(--gold);margin:22px 0 10px">WRONG QUESTIONS</h1>`+
  (wrong.length?`<div class="chips">${wrong.map(j=>`<span class="chip" style="border-color:var(--bad);color:#ffd9d9">Q${j+1} · ${esc(String(qs[j].badge).split(' - ')[0])} · ${fmtT(times[j])}</span>`).join('')}</div><p class="msg" style="font-size:12px;text-align:left;margin:0 0 6px">Tap any question below to see what went wrong.</p>`:'<p class="msg" style="text-align:left">None. Clean sweep.</p>');
}

let set=null,i=0,ans=[],locked=false,startTime=Date.now();
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const imgs=v=>v?(Array.isArray(v)?v:[v]):[];
const oh=o=>typeof o==='string'?`<span>${esc(o)}</span>`:`<span>${o.text?esc(o.text):''}${o.img?`<img class="oi" src="${o.img}" alt="">`:''}</span>`;
const ot=o=>typeof o==='string'?o:(o.text||'(see image)');
const brand='<div class="brand"><i></i>DOOMSAGE QUIZ</div>';
const API='https://doom-server.tail61d13c.ts.net/quizapi/api';
function ago(ts){try{const t=new Date(ts.replace(' ','T'));const d=(Date.now()-t.getTime())/1000;if(d<90)return 'just now';if(d<3600)return Math.round(d/60)+'m ago';if(d<86400)return Math.round(d/3600)+'h ago';if(d<86400*7)return Math.round(d/86400)+'d ago';return t.toLocaleDateString('en-IN',{day:'numeric',month:'short'})}catch(e){return ''}}
let buildingPoll=null;
async function home(){
  clearInterval(buildingPoll);
  const sets=await (await fetch('catalog.json')).json();
  let mine=[];try{mine=JSON.parse(localStorage.getItem('dq-custom-sets')||'[]')}catch(e){}
  app.innerHTML=`<div class="view">${brand}<h1>Pick a set</h1><p class="sub">Tap an option, get the answer instantly.</p>`+
  `<button class="set" id="cv"><span class="tag">NEW</span><b>Paper to quiz</b><span>Upload a question paper PDF - AI builds a playable quiz</span><div class="go">→</div></button>`+
  `<div id="sv"></div><div id="building"></div>`+
  `<h2 style="font-size:15px;letter-spacing:.18em;color:var(--gold);margin:26px 0 12px">COMMUNITY TESTS</h2><div id="comm"><p class="sub" style="font-size:13px">Loading tests from the home server...</p></div>`+
  (mine.length?'<h2 style="font-size:15px;letter-spacing:.18em;color:var(--gold);margin:26px 0 12px">MY PAPERS</h2>':'')+
  mine.map(s=>`<button class="set" data-my="${s.id}"><span class="tag" style="background:#3a3a2a;color:var(--cream)">My papers</span><b>${esc(s.title)}</b><span>${esc(s.subtitle||'')} · ${s.count} questions</span><div class="go">→</div></button>`).join('')+
  '<h2 style="font-size:15px;letter-spacing:.18em;color:var(--gold);margin:26px 0 12px">BUILT-IN SETS</h2>'+
  sets.map(s=>`<button class="set" data-f="${[].concat(s.file).join(',')}"><span class="tag">${s.tag}</span><b>${esc(s.title)}</b><span>${esc(s.subtitle)} · ${[].concat(s.file).length>0?s.count:s.count} questions</span><div class="go">→</div></button>`).join('')+
  '<div class="credit">DOOMSAGE</div></div>';
  $('#cv').onclick=()=>location.href='convert.html';
  let saved=[];try{saved=await idb.all('quizzes')}catch(e){}
  const savedIds=new Set(saved.map(x=>x.id));
  const H='<h2 style="font-size:15px;letter-spacing:.18em;color:var(--gold);margin:26px 0 12px">';
  if(saved.length){
    saved.sort((x,y)=>(y.saved||0)-(x.saved||0));
    $('#sv').innerHTML=H+'SAVED FOR OFFLINE</h2>'+saved.map(q=>`<div class="cw"><button class="set" data-dl="${q.id}"><span class="tag">Offline</span><b>${esc(q.title)}</b><span>${esc(q.subjects||'Mixed')} · ${q.count||0} questions · works without internet</span><div class="go">→</div></button><button class="pill" data-rm="${q.id}">Remove</button></div>`).join('');
    document.querySelectorAll('[data-dl]').forEach(b=>b.onclick=()=>location.href='convert.html?dl='+b.dataset.dl);
    document.querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{if(confirm('Remove this saved copy from this phone? It stays in Community tests.')){await idb.del(b.dataset.rm,'quizzes');home()}});
  }
  async function saveQ(q,btn){
    btn.disabled=true;btn.textContent='Saving...';
    try{
      const j=await (await fetch(API+'/quizzes/'+q.id,{signal:AbortSignal.timeout(25000)})).json();
      if(!j||!j.quiz)throw Error('Could not load the test.');
      let pdf=null;
      if(j.source_pdf){const pr=await fetch(API+'/files/quizzes/'+j.id+'/'+j.source_pdf,{signal:AbortSignal.timeout(60000)});if(!pr.ok)throw Error('Could not download the paper PDF.');pdf=await pr.blob()}
      await idb.put(j.id,{id:j.id,title:j.quiz.title||j.title,subjects:j.subjects,count:j.question_count,created:j.created,quiz:j.quiz,pdf,saved:Date.now()},'quizzes');
      if(!(await offlineReady()))throw Error('Offline files are still loading. Stay online a few seconds and tap again.');
      home();
    }catch(e){btn.disabled=false;btn.textContent='Save offline';alert('Could not save for offline: '+(e.message||e))}
  }
  fetch(API+'/quizzes',{signal:AbortSignal.timeout(15000)}).then(r=>r.json()).then(j=>{
    const items=(j&&j.items)||[];
    const c=$('#comm');if(!c)return;
    if(!items.length){c.innerHTML='<p class="sub" style="font-size:13px">No community tests yet - convert a paper and it shows up here for everyone.</p>';return}
    c.innerHTML=items.map(q=>`<div class="cw"><button class="set" data-play="${q.id}"><span class="tag" style="background:#3a3a2a;color:var(--cream)">Community</span><b>${esc(q.title)}</b><span>${esc(q.subjects||'Mixed')} · ${q.question_count||0} questions · ${q.plays||0} plays · ${ago(q.created)}</span><div class="go">→</div></button>${savedIds.has(q.id)?'<button class="pill on" disabled>Saved ✓</button>':`<button class="pill" data-sv="${q.id}">Save offline</button>`}</div>`).join('');
    c.querySelectorAll('[data-play]').forEach(b=>b.onclick=()=>location.href='convert.html?play='+b.dataset.play);
    c.querySelectorAll('[data-sv]').forEach(b=>b.onclick=()=>saveQ(items.find(x=>x.id===b.dataset.sv),b));
  }).catch(()=>{const c=$('#comm');if(c)c.innerHTML='<p class="sub" style="font-size:13px">Community tests need internet and the home server. '+(saved.length?'Your saved tests above still work offline.':'Save tests for offline while you are online.')+'</p>'});
  async function updateBuilding(){
    const box=$('#building');if(!box){clearInterval(buildingPoll);return}
    try{
      const r=await fetch(API+'/jobs',{signal:AbortSignal.timeout(12000)});if(!r.ok)throw Error('unavailable');const j=await r.json();
      if(!j.items?.length){box.innerHTML='';return}
      box.innerHTML=H+'BUILDING TESTS</h2>'+j.items.map(q=>`<button class="set" data-job="${q.id}"><span class="tag">${q.count?'Ready to solve':q.status==='paused'?'Paused':'Building'}</span><b>${esc(q.title)}</b><span>${q.progress}% complete · ${q.completed}/${q.total} pages · ${q.count} questions ready</span><span>${q.status==='complete'?'Complete':q.status==='paused'?'Build paused - ready questions remain playable':'More questions are being built in the background'}</span><div class="go">→</div></button>`).join('');
      box.querySelectorAll('[data-job]').forEach(b=>b.onclick=()=>location.href='convert.html?job='+b.dataset.job);
    }catch(e){if(!box.children.length)box.innerHTML='<p class="sub" style="font-size:13px">Building tests need the home server. Reconnecting...</p>'}
  }
  updateBuilding();buildingPoll=setInterval(updateBuilding,5000);
  document.querySelectorAll('[data-my]').forEach(b=>b.onclick=()=>location.href='convert.html?set='+b.dataset.my);
  document.querySelectorAll('[data-f]').forEach(b=>b.onclick=async()=>{const fs=b.dataset.f.split(',');const parts=await Promise.all(fs.map(f=>fetch(f).then(r=>r.json())));set={...parts[0],questions:parts.flatMap(p=>p.questions)};i=0;ans=[];times=[];startTime=Date.now();show()});
}
function show(){
  clearInterval(buildingPoll);
  locked=false;const q=set.questions[i],n=set.questions.length;
  app.innerHTML=`<div class="view"><div class="top"><button class="x" id="quit">✕</button><div class="bar"><div style="width:${i/n*100}%"></div></div><div class="sw" id="sw">0:00</div><button class="x" id="inv" title="Swap question and options">⇅</button><div class="cnt">${i+1}/${n}</div></div>
  <div class="qa${inv?' inv':''}"><div class="qblk"><span class="badge">${esc(q.badge)}</span><p class="q">${esc(q.q)}</p>${imgs(q.img).map(u=>`<img class="qi" src="${u}" alt="">`).join('')}
</div><div class="oblk">  ${q.options.map((o,k)=>`<button class="opt" data-k="${k}"><em>${L[k]}</em>${oh(o)}</button>`).join('')}
  <div id="ex"></div></div></div><div class="credit">DOOMSAGE</div></div><div class="foot" id="ft" style="display:none"><button class="btn" id="nx">${i+1<n?'Next question →':'See score'}</button></div>`;
  startQ();
  $('#inv').onclick=()=>{inv=!inv;try{localStorage.setItem('dq-inv',inv?'1':'0')}catch(e){}document.querySelector('.qa').classList.toggle('inv',inv)};
  requestAnimationFrame(()=>{document.querySelector('.bar div').style.width=(i+1)/n*100+'%'});
  $('#quit').onclick=()=>{clearInterval(tick);home()};
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  document.querySelectorAll('.qi').forEach(m=>m.onclick=()=>{$('#zm img').src=m.src;$('#zm').style.display='flex'});
  $('#nx').onclick=()=>{i++;window.scrollTo(0,0);i<n?show():done()};
}
function pick(k){
  if(locked)return;locked=true;stopQ();const q=set.questions[i];ans[i]=k;
  document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(j===q.answer)b.classList.add('ok');else if(j===k)b.classList.add('bad')});
  if(navigator.vibrate)navigator.vibrate(k===q.answer?25:[40,30,40]);
  $('#ex').innerHTML=`<div class="exp"><b>${k===q.answer?'Correct.':'Wrong. Answer: '+L[q.answer]+'.'}</b> ${esc(q.explain)}</div>`;
  $('#ft').style.display='block';
  setTimeout(()=>$('#ex').scrollIntoView({behavior:'smooth',block:'center'}),120);
}
function done(){
  const n=set.questions.length,okOf=j=>ans[j]===set.questions[j].answer,s=ans.filter((a,j)=>a===set.questions[j].answer).length,C=2*Math.PI*75;
  const m=s===n?'Perfect. Locked in.':s>=n*.7?'Strong. Review the misses.':s>=n*.4?'Decent. Revise the reviews below.':'Rough one. Read the reviews and retry.';
  app.innerHTML=`<div class="view">${brand}<div class="ring"><svg width="170" height="170"><circle class="t" cx="85" cy="85" r="75"/><circle class="p" id="pr" cx="85" cy="85" r="75" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg><div>${s}/${n}</div></div>
  <p class="msg">${m}</p>${report(okOf)}<h1 style="font-size:16px;letter-spacing:.14em;color:var(--gold);margin:22px 0 10px">FULL REVIEW</h1>`+
  set.questions.map((q,j)=>{const ok=ans[j]===q.answer;return `<div class="rv ${ok?'ok':'bad'}"><div class="d">${ok?'✓':'✕'}</div><div><b>Q${j+1}</b> · ${esc(q.badge)}<small>${ok?'You got it':(ans[j]==null?'Skipped':'You chose '+L[ans[j]])+', answer '+L[q.answer]} · ${fmtT(times[j])}</small><div class="more"><p>${esc(q.q.split('\n')[0])}</p><p><b style="color:var(--gold)">${L[q.answer]}.</b> ${esc(ot(q.options[q.answer]))}</p>${q.options[q.answer].img?`<img class="oi" src="${q.options[q.answer].img}" alt="">`:''}<p>${esc(q.explain)}</p></div></div></div>`}).join('')+
  '<div style="height:10px"></div><button class="btn" id="re" style="position:static">Retry</button><button class="btn ghost" id="hm">All sets</button><div class="credit">DOOMSAGE</div></div>';
  setTimeout(()=>{$('#pr').style.strokeDashoffset=C*(1-s/n)},80);
  document.querySelectorAll('.rv').forEach(r=>r.onclick=()=>r.classList.toggle('open'));
  $('#re').onclick=()=>{i=0;ans=[];times=[];startTime=Date.now();show()};$('#hm').onclick=home;
}
$('#zm').onclick=()=>{$('#zm').style.display='none'};
home();
</script></body></html>
