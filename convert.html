<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Paper to Quiz - Doomsage Quiz</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<style>
:root{--gold:#D4AF37;--cream:#F8F8D4;--bg:#000;--card:#111;--line:#2a2a22;--ok:#2ecc71;--bad:#ff5252}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--cream);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;min-height:100%}
body{background:radial-gradient(120% 60% at 50% -10%,#2a220a 0%,#000 60%) no-repeat,#000;min-height:100vh}
#app{max-width:560px;margin:0 auto;padding:20px 18px calc(90px + env(safe-area-inset-bottom))}
.brand{display:flex;align-items:center;gap:10px;letter-spacing:.25em;font-size:12px;color:var(--gold);font-weight:700;margin-bottom:26px}
.brand i{width:8px;height:8px;border-radius:50%;background:var(--gold);box-shadow:0 0 12px var(--gold)}
h1{font-size:30px;margin:0 0 6px;line-height:1.15}
.sub{color:#a9a98a;margin:0 0 24px;font-size:15px}
.view{animation:in .35s cubic-bezier(.2,.8,.2,1)}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.drop{display:block;width:100%;text-align:left;background:linear-gradient(145deg,#1a1608,#0d0d0d);border:1.5px dashed #5a4912;border-radius:18px;padding:18px;color:inherit;font:inherit;cursor:pointer;margin-bottom:14px;transition:transform .15s,border-color .2s}
.drop:active{transform:scale(.98);border-color:var(--gold)}
.drop b{font-size:17px;display:block;margin:6px 0 2px}.drop span{color:#a9a98a;font-size:13px}
.drop .fn{color:var(--gold);font-size:13px;margin-top:8px;display:block;word-break:break-all}
.tag{display:inline-block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#000;background:var(--gold);padding:3px 9px;border-radius:99px;font-weight:700}
.foot{position:fixed;left:0;right:0;bottom:0;padding:12px 18px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#000 40%)}
.btn{display:block;width:100%;max-width:524px;margin:0 auto;background:var(--gold);color:#000;border:0;border-radius:14px;padding:15px;font-size:16px;font-weight:800;cursor:pointer;transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.97)}.btn.ghost{background:none;color:var(--gold);border:1px solid var(--gold);margin-top:10px}
.btn:disabled{opacity:.4;cursor:default}
.err{background:#2c0e0e;border:1px solid var(--bad);color:#ffd9d9;border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.5;margin:14px 0;display:none}
.note{color:#8a8a72;font-size:13px;line-height:1.5;margin-top:18px}
.spin{width:54px;height:54px;border-radius:50%;border:4px solid #1c1c16;border-top-color:var(--gold);margin:30px auto 18px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.stat{display:flex;gap:10px;margin:16px 0}
.stat div{flex:1;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{font-size:22px;color:var(--gold);display:block}
.stat span{font-size:11px;color:#a9a98a;letter-spacing:.08em;text-transform:uppercase}
.warn{background:#14110a;border-left:3px solid var(--gold);border-radius:6px 12px 12px 6px;padding:10px 12px;font-size:13px;line-height:1.5;margin:10px 0;color:#cfcfae}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.chip{font-size:12px;border:1px solid var(--line);border-radius:99px;padding:4px 10px;color:#a9a98a}
.top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.x{background:none;border:1px solid var(--line);color:var(--cream);width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer}
.bar{flex:1;height:6px;background:#1c1c16;border-radius:9px;overflow:hidden}
.bar div{height:100%;background:linear-gradient(90deg,#8a6d12,var(--gold));border-radius:9px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.cnt{font-size:13px;color:var(--gold);font-weight:700;min-width:42px;text-align:right}
.badge{display:inline-block;font-size:12px;color:var(--gold);border:1px solid #5a4912;padding:4px 10px;border-radius:99px;margin-bottom:14px}
.q{font-size:18px;line-height:1.5;margin:0 0 20px;white-space:pre-line}
.opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);color:var(--cream);font:inherit;font-size:16px;line-height:1.4;padding:14px;border-radius:14px;margin-bottom:10px;cursor:pointer;transition:transform .12s,border-color .2s,background .25s}
.opt:active:not(:disabled){transform:scale(.98)}
.opt em{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid #5a5a40;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:700;color:var(--gold)}
.opt:disabled{cursor:default;color:#8a8a72}
.opt.ok{background:#0c2a18;border-color:var(--ok);color:#eafff2;animation:pop .4s}
.opt.ok em{background:var(--ok);border-color:var(--ok);color:#000}
.opt.bad{background:#2c0e0e;border-color:var(--bad);color:#ffeaea;animation:shake .4s}
.opt.bad em{background:var(--bad);border-color:var(--bad);color:#000}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.03)}100%{transform:scale(1)}}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.exp{background:#14110a;border-left:3px solid var(--gold);border-radius:6px 12px 12px 6px;padding:12px 14px;font-size:14.5px;line-height:1.5;margin-top:14px;animation:in .35s}
.exp b{color:var(--gold)}
.numin{width:100%;background:var(--card);border:1.5px solid var(--line);color:var(--cream);font:inherit;font-size:18px;padding:14px;border-radius:14px;margin-bottom:10px;outline:none}
.numin:focus{border-color:var(--gold)}
.numin.ok{background:#0c2a18;border-color:var(--ok)}
.numin.bad{background:#2c0e0e;border-color:var(--bad)}
.figbtn{display:inline-block;background:none;border:1px solid #5a4912;color:var(--gold);border-radius:99px;padding:6px 12px;font-size:12px;cursor:pointer;margin:0 0 16px}
.ring{width:170px;height:170px;margin:10px auto 14px;position:relative}
.ring svg{transform:rotate(-90deg)}.ring circle{fill:none;stroke-width:10}
.ring .t{stroke:#1c1c16}.ring .p{stroke:var(--gold);stroke-linecap:round;transition:stroke-dashoffset 1.1s cubic-bezier(.2,.8,.2,1)}
.ring div{position:absolute;inset:0;display:grid;place-items:center;font-size:40px;font-weight:800}
.msg{text-align:center;color:#a9a98a;margin:0 0 22px}
.rv{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);background:var(--card);border-radius:14px;padding:12px;margin-bottom:8px;font-size:14px;line-height:1.4;cursor:pointer}
.rv .d{flex:none;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#000}
.rv.ok .d{background:var(--ok)}.rv.bad .d{background:var(--bad)}
.rv small{color:#8a8a72;display:block;margin-top:3px}
.rv .more{display:none;margin-top:8px;color:#cfcfae}.rv.open .more{display:block}
.rv .more p{margin:4px 0}
#zm{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:9;padding:14px}
#zm img{max-width:100%;max-height:100%;background:#fff;border-radius:10px;padding:8px}
.sw{font-variant-numeric:tabular-nums;font-size:13px;font-weight:700;color:#000;background:var(--gold);border-radius:99px;padding:4px 10px;min-width:52px;text-align:center}.sw.done{background:#3a3a2a;color:var(--cream)}.sj{margin-bottom:12px}.sjh{display:flex;justify-content:space-between;gap:8px;font-size:14px}.sjh span{color:#a9a98a;font-size:12px}.sjb{height:6px;background:#3a1414;border-radius:9px;overflow:hidden;margin-top:5px}.sjb div{height:100%;background:var(--ok)}
.qa{display:flex;flex-direction:column;min-height:calc(100vh - 230px)}.qa.inv .qblk{order:2;margin-top:auto;padding-top:18px}.qa.inv .oblk{order:1}
.credit{text-align:center;font-size:11px;letter-spacing:.3em;color:#8a6f1c;margin-top:34px}
</style></head><body><div id="app"></div><div id="zm"><img alt=""></div>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>
if(window.pdfjsLib)pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $=s=>document.querySelector(s),app=$('#app');
const L=['A','B','C','D'];
let inv=false;try{inv=localStorage.getItem('dq-inv')==='1'}catch(e){}
let times=[],qStart=0,tick=null;
function fmtSw(ms){const s=Math.floor(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function fmtT(ms){if(!ms||ms<0)return '0s';const s=Math.round(ms/1000);if(s<60)return s+'s';return Math.floor(s/60)+'m '+(s%60)+'s'}
function startQ(){qStart=Date.now();clearInterval(tick);tick=setInterval(()=>{const e=document.getElementById('sw');if(e)e.textContent=fmtSw(Date.now()-qStart)},250)}
function stopQ(){times[i]=Date.now()-qStart;clearInterval(tick);const e=document.getElementById('sw');if(e){e.textContent=fmtSw(times[i]);e.classList.add('done')}}
function report(okOf){
  const qs=set.questions,n=qs.length;const subj={};
  qs.forEach((q,j)=>{const k=String(q.badge).split(' - ')[0];const o=subj[k]||(subj[k]={t:0,c:0,ms:0});o.t++;if(okOf(j))o.c++;o.ms+=times[j]||0});
  const wrong=qs.map((_,j)=>j).filter(j=>!okOf(j));const c=n-wrong.length;
  const tot=times.reduce((a,b)=>a+(b||0),0);
  let slow=-1;times.forEach((t,j)=>{if(slow<0||t>times[slow])slow=j});
  return `<div class="stat"><div><b style="color:var(--ok)">${c}</b><span>Correct</span></div><div><b style="color:var(--bad)">${wrong.length}</b><span>Wrong</span></div><div><b>${Math.round(c/n*100)}%</b><span>Accuracy</span></div></div>
  <p class="msg" style="font-size:13px;margin:-6px 0 18px">Total ${fmtT(tot)} · avg ${fmtT(tot/n)} per question${slow>=0&&times[slow]?` · slowest Q${slow+1} (${fmtT(times[slow])})`:''}</p>
  <h1 style="font-size:16px;letter-spacing:.14em;color:var(--gold);margin:6px 0 10px">BY SUBJECT</h1>`+
  Object.entries(subj).map(([k,o])=>`<div class="sj"><div class="sjh"><b>${esc(k)}</b><span>${o.c}/${o.t} correct · ${o.t-o.c} wrong · avg ${fmtT(o.ms/o.t)}</span></div><div class="sjb"><div style="width:${o.c/o.t*100}%"></div></div></div>`).join('')+
  `<h1 style="font-size:16px;letter-spacing:.14em;color:var(--gold);margin:22px 0 10px">WRONG QUESTIONS</h1>`+
  (wrong.length?`<div class="chips">${wrong.map(j=>`<span class="chip" style="border-color:var(--bad);color:#ffd9d9">Q${j+1} · ${esc(String(qs[j].badge).split(' - ')[0])} · ${fmtT(times[j])}</span>`).join('')}</div><p class="msg" style="font-size:12px;text-align:left;margin:0 0 6px">Tap any question below to see what went wrong.</p>`:'<p class="msg" style="text-align:left">None. Clean sweep.</p>');
}

const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const brand='<div class="brand"><i></i>DOOMSAGE QUIZ</div>';
function fmtTime(ms){if(!ms||ms<0)return '0s';const s=Math.round(ms/1000);if(s<60)return s+'s';const m=Math.floor(s/60);return m+'m '+(s%60)+'s'}
const MAX=3.1*1024*1024;
let paperFile=null,keyFile=null,pdfBuf=null,pdfDoc=null,set=null,i=0,ans=[],locked=false,communityMode=false,communityId=null,startTime=null,pubCreated='',isDl=false;
const API='https://doom-server.tail61d13c.ts.net/quizapi/api';

// ---- tiny IndexedDB wrapper: stores the paper PDF so figure pages stay viewable
const idb={db:null,open(){return new Promise((res,rej)=>{if(this.db)return res(this.db);const r=indexedDB.open('doomsage-quiz',2);r.onupgradeneeded=()=>{const d=r.result;['pdfs','quizzes'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n)})};r.onsuccess=()=>{this.db=r.result;res(r.result)};r.onerror=()=>rej(r.error)})},
put(id,blob,st){return this.open().then(db=>new Promise((res,rej)=>{const tx=db.transaction(st||'pdfs','readwrite');tx.objectStore(st||'pdfs').put(blob,id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)}))},
get(id,st){return this.open().then(db=>new Promise((res,rej)=>{const rq=db.transaction(st||'pdfs').objectStore(st||'pdfs').get(id);rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error)}))},
del(id,st){return this.open().then(db=>new Promise((res,rej)=>{const tx=db.transaction(st,'readwrite');tx.objectStore(st).delete(id);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)}))},
all(st){return this.open().then(db=>new Promise((res,rej)=>{const rq=db.transaction(st).objectStore(st).getAll();rq.onsuccess=()=>res(rq.result||[]);rq.onerror=()=>rej(rq.error)}))}};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
async function offlineReady(){
  try{await navigator.serviceWorker.ready}catch(e){}
  const need=['index.html','convert.html','https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js','https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js','https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'];
  for(const u of need){if(!(await caches.match(u,{ignoreSearch:true})))return false}return true;
}

function tex(){if(set&&set.latex&&window.renderMathInElement)renderMathInElement(app,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false}],throwOnError:false})}
async function pageImage(n){
  try{
    if(!pdfDoc){if(!pdfBuf)return null;pdfDoc=await pdfjsLib.getDocument({data:pdfBuf.slice(0)}).promise}
    const p=await pdfDoc.getPage(Math.max(1,Math.min(n,pdfDoc.numPages)));
    const vp=p.getViewport({scale:2});const c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
    await p.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;return c.toDataURL('image/png');
  }catch(e){return null}
}
async function showFigure(n,btn){
  btn.textContent='Loading page...';
  const u=await pageImage(n);
  if(u){$('#zm img').src=u;$('#zm').style.display='flex'}
  btn.textContent='See figure (page '+n+')';
  if(!u){btn.textContent='Figure not available - PDF not stored'}
}

const jobId=new URLSearchParams(location.search).get('job');
let liveJob=null,jobPoll=null,waitingForQuestion=false;
async function submitBackground(){
  if(!paperFile)return;
  if(paperFile.size+(keyFile?keyFile.size:0)>MAX)return fail('Combined PDF limit is 3 MB.');
  const btn=$('#go');btn.disabled=true;btn.textContent='Uploading paper...';
  try{
    const rd=f=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result.split(',')[1]);r.onerror=rej;r.readAsDataURL(f)});
    const files=[{kind:'paper',name:paperFile.name,data:await rd(paperFile)}];
    if(keyFile)files.push({kind:'key',name:keyFile.name,data:await rd(keyFile)});
    const title=$('#jobtitle').value.trim()||paperFile.name.replace(/\.pdf$/i,'');
    const r=await fetch(API+'/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title,files}),signal:AbortSignal.timeout(60000)});
    const j=await r.json();if(!r.ok||!j.id)throw Error(j.error||'Upload failed');
    localStorage.setItem('dq-job-token-'+j.id,j.token);
    location.href='index.html';
  }catch(e){btn.disabled=false;btn.textContent='Upload and build quiz';fail(e.message||'Upload failed. Retry.')}
}
function liveStatus(){
  if(!jobId||!liveJob)return '';
  return `<div class="warn" id="live-status">${liveJob.status==='complete'?'Complete':liveJob.status==='paused'?'Conversion paused':'Building in background'} · ${liveJob.progress}% · ${liveJob.completed}/${liveJob.total} pages · ${liveJob.count} questions ready${liveJob.error?'<br>'+esc(liveJob.error):''}</div>`;
}
function paintLive(){
  if(!jobId)return;const old=$('#live-status');if(old)old.outerHTML=liveStatus();
  else if($('.top'))$('.top').insertAdjacentHTML('afterend',liveStatus());
  if($('.cnt'))$('.cnt').textContent=(i+1)+'/'+set.questions.length+(liveJob.status==='complete'?'':' +');
}
function saveLiveAttempt(){if(jobId)try{localStorage.setItem('dq-attempt-'+jobId,JSON.stringify({i,ans,times}))}catch(e){}}
async function fetchLive(){
  const r=await fetch(API+'/jobs/'+jobId,{signal:AbortSignal.timeout(15000)});const j=await r.json();if(!r.ok)throw Error(j.error||'Test not found');
  liveJob=j;
  if(!set)set={id:j.id,title:j.title,latex:true,questions:j.questions};else set.questions=j.questions;
  if(liveJob.status==='complete')clearInterval(jobPoll);
  paintLive();
  if(waitingForQuestion){if(i<set.questions.length){waitingForQuestion=false;show()}else if(j.status==='complete'){waitingForQuestion=false;done()}else showWaiting()}
  return j;
}
function showWaiting(){
  waitingForQuestion=true;clearInterval(tick);
  app.innerHTML=`<div class="view">${brand}<h1 style="font-size:24px">${liveJob.status==='paused'?'Build paused':'You are all caught up'}</h1><p class="sub">${liveJob.status==='paused'?'Your ready questions and answers are safe.':'The next questions will appear here automatically as they are ready.'}</p>${liveStatus()}<button class="btn" id="back-list">Back to tests</button>${set.questions.length?'<button class="btn ghost" id="partial-score">See score for ready questions</button>':''}<div id="resume-job"></div></div>`;
  $('#back-list').onclick=()=>location.href='index.html';
  if($('#partial-score'))$('#partial-score').onclick=()=>{waitingForQuestion=false;done()};
  const token=localStorage.getItem('dq-job-token-'+jobId);
  if(token&&liveJob.status==='paused'){
    $('#resume-job').innerHTML='<button class="btn ghost" id="resume-build">Resume building</button>';
    $('#resume-build').onclick=async()=>{const b=$('#resume-build');b.disabled=true;try{const r=await fetch(API+'/jobs/'+jobId+'/resume',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token})});if(!r.ok)throw Error('Could not resume');await fetchLive()}catch(e){b.disabled=false;b.textContent='Retry resume'}};
  }
}
async function startLive(){
  app.innerHTML=`<div class="view">${brand}<p class="sub">Loading your building test...</p></div>`;
  try{
    await fetchLive();communityMode=true;communityId=null;
    try{const a=JSON.parse(localStorage.getItem('dq-attempt-'+jobId)||'null');if(a){i=a.i||0;ans=a.ans||[];times=a.times||[]}}catch(e){}
    // Only restore answered positions. An unanswered current question starts fresh.
    i=Math.min(i,set.questions.length);startTime=Date.now();
    fetch(API+'/jobs/'+jobId+'/pdf').then(r=>r.ok?r.arrayBuffer():null).then(b=>{if(b)pdfBuf=b}).catch(()=>{});
    i<set.questions.length?show():showWaiting();
    jobPoll=setInterval(()=>fetchLive().catch(()=>{const e=$('#live-status');if(e)e.textContent='Reconnecting... saved questions remain playable.'}),5000);
  }catch(e){app.innerHTML=`<div class="view">${brand}<h1>Could not load test</h1><p>${esc(e.message)}</p><a href="index.html">Back to tests</a></div>`}
}

// ---- upload view
function uploadView(){
  paperFile=keyFile=null;
  app.innerHTML=`<div class="view">${brand}<h1>Paper to quiz</h1><p class="sub">Upload a question paper PDF. AI reads it and builds a playable quiz.</p>
  <button class="drop" id="dp"><span class="tag">Required</span><b>Question paper (PDF)</b><span>ALLEN / coaching test with the questions</span><span class="fn" id="fp"></span></button>
  <button class="drop" id="dk"><span class="tag" style="background:#3a3a2a;color:var(--cream)">Optional</span><b>Answer key / hint sheet (PDF)</b><span>Add it for exact answers and official solutions</span><span class="fn" id="fk"></span></button>
  <label class="note" for="jobtitle">Test name</label><input class="numin" id="jobtitle" maxlength="120" placeholder="Use paper filename">
  <div class="warn">Uploads appear in Community tests for everyone, including the original PDF. Do not upload private papers or personal information.</div>
  <div class="err" id="er"></div>
  <p class="note">Free converter - up to ~3 MB of PDFs at a time. After upload, your test appears in the list and keeps building on the home server, even if you leave this page. Start solving as soon as questions are ready. Internet and the home server are needed while building.</p>
  </div><div class="foot"><button class="btn" id="go" disabled>Upload and build quiz</button><button class="btn ghost" id="hm">Back to sets</button></div>`;
  $('#hm').onclick=()=>location.href='index.html';
  const pick=(inp,cb)=>{const i=document.createElement('input');i.type='file';i.accept='application/pdf';i.style.position='fixed';i.style.left='-9999px';document.body.appendChild(i);i.onchange=()=>{cb(i.files[0]);setTimeout(()=>i.remove(),1000)};i.click()};
  $('#dp').onclick=()=>pick(0,f=>{paperFile=f;$('#fp').textContent=f?f.name+' ('+(f.size/1048576).toFixed(1)+' MB)':'';ready()});
  $('#dk').onclick=()=>pick(0,f=>{keyFile=f;$('#fk').textContent=f?f.name+' ('+(f.size/1048576).toFixed(1)+' MB)':'';ready()});
  $('#go').onclick=submitBackground;
  idb.get('conversion-job').then(job=>{if(!job)return;const b=document.createElement('button');b.className='btn ghost';b.textContent='Resume saved conversion ('+(job.finished??job.next)+'/'+job.total+' pages)';b.onclick=()=>convert(true);$('#go').after(b)}).catch(()=>{});
  function ready(){$('#go').disabled=!paperFile}
}
function fail(msg){const e=$('#er');if(e){e.textContent=msg;e.style.display='block'}else{alert(msg)}}

// Progress and original PDFs stay private in this browser until Publish is pressed.
async function convert(resume=false){
  if(!resume&&!paperFile)return;
  let job;
  try{
    if(resume){job=await idb.get('conversion-job');if(!job)throw Error('No saved conversion found.')}
    else{
      if(paperFile.size+(keyFile?keyFile.size:0)>MAX)return fail('The combined PDFs must be under 3 MB. Compress the PDFs and retry.');
      job={paper:await paperFile.arrayBuffer(),key:keyFile?await keyFile.arrayBuffer():null,name:paperFile.name,keyName:keyFile?.name,next:0,total:0,questions:[],title:'My paper',subject:'General'};
    }
    paperFile=new File([job.paper],job.name,{type:'application/pdf'});
    keyFile=job.key?new File([job.key],job.keyName,{type:'application/pdf'}):null;
    app.innerHTML=`<div class="view">${brand}<div style="text-align:center;padding-top:40px"><div class="spin"></div><h1 style="font-size:22px">Reading your paper...</h1><p class="sub" id="st">Preparing page-by-page conversion...</p><p class="note">Keep this tab open. Completed pages are saved on this device. If interrupted, return here and tap Resume.</p><div class="sjb"><div id="cp" style="width:0%"></div></div></div></div>`;
    if(!window.pdfjsLib)throw Error('PDF tools did not load. Check your internet and retry.');
    const doc=await pdfjsLib.getDocument({data:job.paper.slice(0)}).promise;job.total=doc.numPages;
    if(!job.total||job.total>150)throw Error('Please use a PDF with 1 to 150 pages.');
    await idb.put('conversion-job',job);
    const to64=bytes=>{let s='';for(let k=0;k<bytes.length;k+=32768)s+=String.fromCharCode(...bytes.subarray(k,k+32768));return btoa(s)};
    if(!window.PDFLib)throw Error('PDF splitter did not load. Check your internet and retry.');
    const source=await PDFLib.PDFDocument.load(job.paper.slice(0));
    // Locate embedded keys where text is available. Include the final two pages
    // as well, including scanned keys, plus headings and cross-page context.
    const keyPages=[];
    for(let p=1;p<=job.total;p++){
      const text=(await (await doc.getPage(p)).getTextContent()).items.map(x=>x.str).join(' ');
      if(/answer\s*(key|sheet)|hints?\s*(and|&)\s*solutions?|correct\s*options?/i.test(text))keyPages.push(p-1);
    }
    job.batches=job.batches||{};
    for(let p=0;p<job.next;p++)if(!job.batches[p])job.batches[p]=job.questions.filter(q=>q.page===p+1);
    let cursor=0,failed=null;
    const progress=()=>{job.finished=Object.keys(job.batches).length;$('#cp').style.width=(job.finished/job.total*100)+'%';$('#st').textContent=Math.round(job.finished/job.total*100)+'% complete - '+job.finished+'/'+job.total+' pages saved - '+job.questions.length+' questions';};
    const readPage=async n=>{
      progress();
      const indexes=[...new Set([0,Math.max(0,n-1),n,Math.min(job.total-1,n+1),...keyPages,Math.max(0,job.total-2),job.total-1])].sort((a,b)=>a-b);
      const excerpt=await PDFLib.PDFDocument.create();for(const p of await excerpt.copyPages(source,indexes))excerpt.addPage(p);
      const pages=indexes.map(p=>p+1);
      const files=[{kind:'paper',name:job.name,data:to64(await excerpt.save())}];
      if(job.key)files.push({kind:'key',name:job.keyName,data:to64(new Uint8Array(job.key))});
      let result;
      for(let attempt=0;attempt<3;attempt++){
        if(attempt){$('#st').textContent=Math.round(Object.keys(job.batches).length/job.total*100)+'% complete - retrying page '+(n+1)+'; saved pages are safe';await new Promise(r=>setTimeout(r,attempt*6000))}
        try{
          const r=await fetch('/api/convert',{method:'POST',headers:{'Content-Type':'application/json'},signal:AbortSignal.timeout(280000),body:JSON.stringify({files,batch:{page:n+1,pages,subject:job.subject}})});
          const j=await r.json().catch(()=>null);
          if(!j?.ok){const e=Error(j?.error||'The converter is temporarily unavailable.');e.terminal=r.status===400||r.status===413||r.status===429||j?.no_paper;throw e}
          result=j.set;break;
        }catch(e){if(e.terminal||attempt===2)throw e}
      }
      for(const q of result.questions)q.page=n+1;
      job.batches[n]=result.questions;
      job.questions=Object.keys(job.batches).sort((a,b)=>a-b).flatMap(k=>job.batches[k]);
      if(result.questions.length)job.subject=String(result.questions.at(-1).badge).split(' - ')[0];
      if(result.title&&result.title!=='My paper')job.title=result.title;
      job.next=0;while(job.next<job.total&&Object.hasOwn(job.batches,job.next))job.next++;
      progress();await idb.put('conversion-job',job);
    };
    // Three bounded workers let other pages progress while a hard page is solved.
    const worker=async()=>{while(!failed&&cursor<job.total){const n=cursor++;if(Object.hasOwn(job.batches,n))continue;try{await readPage(n)}catch(e){failed=e}}};
    await Promise.all([worker(),worker(),worker()]);
    if(failed)throw failed;
    if(!job.questions.length)throw Error('No question starts were found. Check that this is the question paper, not only a key.');
    set={id:'paper-'+Date.now().toString(36),title:job.title,subtitle:[...new Set(job.questions.map(q=>String(q.badge).split(' - ')[0]))].join(' + '),latex:true,count:job.questions.length,questions:job.questions};
    pdfBuf=job.paper;pdfDoc=null;publishView();
  }catch(e){uploadView();fail((e.message||'Conversion interrupted.')+' Completed pages are saved. Tap Resume saved conversion to continue.');}
}

// ---- publish view (compulsory: every converted paper goes to the community library)
function publishView(){
  const qs=set.questions;
  const subs={};qs.forEach(q=>{const s=q.badge.split(' - ')[0];subs[s]=(subs[s]||0)+1});
  app.innerHTML=`<div class="view">${brand}<h1 style="font-size:24px">Name this test</h1><p class="sub">${qs.length} questions extracted. Publishing to Community tests - every converted paper is public, everyone can play it.</p>
  <input class="numin" id="ttl" maxlength="120" value="${esc(set.title).replace(/"/g,'&quot;')}" placeholder="Test title (everyone will see this)">
  <div class="chips">${Object.entries(subs).map(([s,n])=>`<span class="chip">${esc(s)} - ${n}</span>`).join('')}</div>
  <div class="warn">No private uploads here: once published, this test shows up in Community tests for everyone. Do not include personal info in the title or paper.</div>
  <div class="err" id="er"></div>
  </div><div class="foot"><button class="btn" id="pub">Publish to Community tests</button></div>`;
  $('#pub').onclick=publish;
}
async function publish(){
  const ttl=$('#ttl').value.trim()||set.title;
  const btn=$('#pub');btn.disabled=true;btn.textContent='Publishing...';
  try{
    const fd=new FormData();
    fd.append('title',ttl);
    fd.append('subjects',[...new Set(set.questions.map(q=>q.badge.split(' - ')[0]))].join(', '));
    fd.append('question_count',String(set.questions.length));
    fd.append('plays','0');
    fd.append('quiz',JSON.stringify({title:ttl,latex:true,questions:set.questions}));
    if(paperFile&&paperFile.size<4.4*1024*1024)fd.append('source_pdf',paperFile,paperFile.name||'paper.pdf');
    const r=await fetch(API+'/quizzes',{method:'POST',body:fd,signal:AbortSignal.timeout(40000)});
    const j=await r.json().catch(()=>null);
    if(!r.ok||!j||!j.id)throw Error((j&&(j.message||j.error))||'The home server refused the upload.');
    await idb.del('conversion-job','pdfs').catch(()=>{});communityId=j.id;pubCreated=j.created||new Date().toISOString();set.title=ttl;
    preview(true);
  }catch(e){
    btn.disabled=false;btn.textContent='Retry publish';
    fail('Publish failed: '+(e.message||e)+' Check your internet and retry - the quiz is only playable after it is published.');
  }
}

// ---- preview view
function preview(published){
  const qs=set.questions;
  const mcq=qs.filter(q=>!q.numeric).length,num=qs.length-mcq,fig=qs.filter(q=>q.figure).length;
  const subs={};qs.forEach(q=>{const s=q.badge.split(' - ')[0];subs[s]=(subs[s]||0)+1});
  app.innerHTML=`<div class="view">${brand}<h1 style="font-size:24px">${esc(set.title)}</h1><p class="sub">${qs.length} questions extracted</p>
  <div class="stat"><div><b>${qs.length}</b><span>Questions</span></div><div><b>${mcq}</b><span>MCQ</span></div><div><b>${num}</b><span>Numeric</span></div></div>
  <div class="chips">${Object.entries(subs).map(([s,n])=>`<span class="chip">${esc(s)} - ${n}</span>`).join('')}</div>
  ${fig?`<div class="warn">${fig} question${fig>1?'s':''} use${fig>1?'':'s'} a figure. In the quiz, tap "See figure" on those to view the original page.</div>`:''}
  ${published?'<div class="warn" style="border-color:var(--ok)">Live in Community tests - anyone with the site can play it now.</div>':''}
  <div class="warn">AI-extracted - glance through the quiz once before a serious practice run. If a question looks off, check the original PDF.</div>
  </div><div class="foot"><button class="btn" id="pl">Play quiz</button><button class="btn ghost" id="sv">Save for offline</button><button class="btn ghost" id="dl">Download JSON</button><button class="btn ghost" id="nw">Convert another</button></div>`;
  tex();
  $('#pl').onclick=()=>{i=0;ans=[];times=[];startTime=Date.now();show()};
  $('#sv').onclick=()=>saveOffline($('#sv'));
  $('#dl').onclick=()=>{
    const blob=new Blob([JSON.stringify({id:set.id,title:set.title,latex:true,questions:set.questions},null,1)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=set.id+'.json';a.click();
  };
  $('#nw').onclick=uploadView;
}
async function saveOffline(btn){
  const old=btn.textContent;btn.disabled=true;btn.textContent='Saving...';
  try{
    if(!communityId)throw Error('Not published yet.');
    const subs=[...new Set(set.questions.map(q=>q.badge.split(' - ')[0]))].join(', ');
    let pdf=null;
    if(pdfBuf)pdf=new Blob([pdfBuf],{type:'application/pdf'});
    else if(paperFile)pdf=paperFile;
    const needsPdf=set.questions.some(q=>q.figure&&q.page);
    if(needsPdf&&!pdf)throw Error('The paper PDF is not available, so figures cannot be saved.');
    await idb.put(communityId,{id:communityId,title:set.title,subjects:subs,count:set.questions.length,created:pubCreated,quiz:{title:set.title,latex:true,questions:set.questions},pdf,saved:Date.now()},'quizzes');
    if(!(await offlineReady()))throw Error('Offline files are still loading. Stay online a few seconds and tap again.');
    btn.textContent='Saved for offline ✓';
  }catch(e){btn.disabled=false;btn.textContent=old;alert('Could not save for offline: '+(e.message||e))}
}

// ---- quiz player
async function toggleFullscreen(){
  try{
    if(document.fullscreenElement||document.webkitFullscreenElement){const exit=document.exitFullscreen||document.webkitExitFullscreen;if(exit)await exit.call(document)}
    else{const el=document.documentElement;const enter=el.requestFullscreen||el.webkitRequestFullscreen;if(!enter)return alert('This browser does not support full screen. Use Add to Home Screen in the browser menu for an app-like view.');await enter.call(el)}
  }catch(e){alert('Full screen is unavailable in this browser. Try opening this page directly in Chrome, or use Add to Home Screen.')}
}
function show(){
  locked=false;const q=set.questions[i],n=set.questions.length;
  const letters=L.slice(0,q.options?q.options.length:0);
  app.innerHTML=`<div class="view"><div class="top"><button class="x" id="quit">✕</button><div class="bar"><div style="width:${i/n*100}%"></div></div><div class="sw" id="sw">0:00</div><button class="x" id="inv" title="Swap question and options">⇅</button><button class="x" id="fullscreen" title="Toggle full screen" aria-label="Toggle full screen">⛶</button><div class="cnt">${i+1}/${n}</div></div>
  <div class="qa${inv?' inv':''}"><div class="qblk"><span class="badge">${esc(q.badge)}</span><p class="q">${esc(q.q)}</p>
  ${q.figure&&q.page?`<button class="figbtn" id="fig">See figure (page ${q.page})</button>`:''}
</div><div class="oblk">
  ${q.numeric?`<input class="numin" id="numin" inputmode="decimal" autocomplete="off" placeholder="Type your answer (number)">`
    :q.options.map((o,k)=>`<button class="opt" data-k="${k}"><em>${letters[k]}</em><span>${esc(o)}</span></button>`).join('')}
  <div id="ex"></div></div></div><div class="credit">DOOMSAGE</div></div>
  <div class="foot" id="ft"><button class="btn" id="nx" ${q.numeric?'':'style="display:none"'}>${q.numeric?'Check answer':(i+1<n?'Next question →':'See score')}</button></div>`;
  tex();
  paintLive();
  startQ();
  $('#fullscreen').onclick=toggleFullscreen;
  $('#inv').onclick=()=>{inv=!inv;try{localStorage.setItem('dq-inv',inv?'1':'0')}catch(e){}document.querySelector('.qa').classList.toggle('inv',inv)};
  requestAnimationFrame(()=>{document.querySelector('.bar div').style.width=(i+1)/n*100+'%'});
  $('#quit').onclick=homeConfirm;
  if(q.figure&&q.page)$('#fig').onclick=e=>showFigure(q.page,e.target);
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>pick(+b.dataset.k));
  if(q.numeric){
    $('#numin').addEventListener('keydown',e=>{if(e.key==='Enter')checkNum()});
    $('#nx').onclick=()=>locked?next():checkNum();
  }else{
    $('#nx').onclick=next;
  }
}
function homeConfirm(){clearInterval(tick);communityMode?location.href='index.html':preview()}
function next(){i++;saveLiveAttempt();window.scrollTo(0,0);if(jobId&&i>=set.questions.length&&liveJob.status!=='complete')return showWaiting();i<set.questions.length?show():done()}
function pick(k){
  if(locked)return;locked=true;stopQ();const q=set.questions[i];ans[i]=k;saveLiveAttempt();
  document.querySelectorAll('.opt').forEach((b,j)=>{b.disabled=true;if(j===q.answer)b.classList.add('ok');else if(j===k)b.classList.add('bad')});
  if(navigator.vibrate)navigator.vibrate(k===q.answer?25:[40,30,40]);
  $('#ex').innerHTML=`<div class="exp"><b>${k===q.answer?'Correct.':'Wrong. Answer: '+L[q.answer]+'.'}</b> ${esc(q.explain)}</div>`;tex();
  $('#nx').style.display='block';$('#nx').textContent=i+1<set.questions.length?'Next question →':'See score';
  setTimeout(()=>$('#ex')?.scrollIntoView({behavior:'smooth',block:'center'}),120);
}
function numOk(v,a){const x=parseFloat(v),y=parseFloat(a);if(isNaN(x)||isNaN(y))return String(v).trim()===String(a).trim();const t=Math.max(0.011,Math.abs(y)*0.005);return Math.abs(x-y)<=t}
function checkNum(){
  if(locked)return;const inp=$('#numin');const v=inp.value.trim();if(!v)return inp.focus();
  locked=true;stopQ();const q=set.questions[i];const ok=numOk(v,q.answer_value);ans[i]={v,ok};saveLiveAttempt();
  inp.disabled=true;inp.classList.add(ok?'ok':'bad');
  if(navigator.vibrate)navigator.vibrate(ok?25:[40,30,40]);
  $('#ex').innerHTML=`<div class="exp"><b>${ok?'Correct.':'Wrong. Answer: '+esc(q.answer_value)+'.'}</b> ${esc(q.explain)}</div>`;tex();
  $('#nx').textContent=i+1<set.questions.length?'Next question →':'See score';
  setTimeout(()=>$('#ex')?.scrollIntoView({behavior:'smooth',block:'center'}),120);
}
function done(){
  const n=set.questions.length;
  const okOf=j=>{const q=set.questions[j],a=ans[j];return q.numeric?(a&&a.ok===true):a===q.answer};
  const s=set.questions.filter((_,j)=>okOf(j)).length,C=2*Math.PI*75;
  const m=s===n?'Perfect. Locked in.':s>=n*.7?'Strong. Review the misses.':s>=n*.4?'Decent. Revise the reviews below.':'Rough one. Read the reviews and retry.';
  app.innerHTML=`<div class="view">${brand}<div class="ring"><svg width="170" height="170"><circle class="t" cx="85" cy="85" r="75"/><circle class="p" id="pr" cx="85" cy="85" r="75" stroke-dasharray="${C}" stroke-dashoffset="${C}"/></svg><div>${s}/${n}</div></div>
  <p class="msg">${m}</p>${report(okOf)}<h1 style="font-size:16px;letter-spacing:.14em;color:var(--gold);margin:22px 0 10px">FULL REVIEW</h1>`+
  set.questions.map((q,j)=>{const ok=okOf(j);const you=q.numeric?(ans[j]?'You wrote '+esc(ans[j].v)+', answer '+esc(q.answer_value):'Skipped, answer '+esc(q.answer_value)):(ans[j]!=null?'You chose '+L[ans[j]]+', answer '+L[q.answer]:'Skipped, answer '+L[q.answer]);
    return `<div class="rv ${ok?'ok':'bad'}"><div class="d">${ok?'✓':'✕'}</div><div><b>Q${j+1}</b> · ${esc(q.badge)}<small>${you} · ${fmtT(times[j])}</small><div class="more"><p>${esc(q.q)}</p>${q.numeric?`<p><b style="color:var(--gold)">Answer: ${esc(q.answer_value)}</b></p>`:`<p><b style="color:var(--gold)">${L[q.answer]}.</b> ${esc(q.options[q.answer])}</p>`}<p>${esc(q.explain)}</p></div></div></div>`}).join('')+
  '<div style="height:10px"></div><button class="btn" id="re" style="position:static">Retry</button>'+(communityMode&&!isDl&&!jobId?'<button class="btn ghost" id="of">Save for offline</button>':'')+(communityMode?'':'<button class="btn ghost" id="pv">Back to paper</button>')+'<button class="btn ghost" id="hm">All sets</button><div class="credit">DOOMSAGE</div></div>';
  tex();
  setTimeout(()=>{$('#pr').style.strokeDashoffset=C*(1-s/n)},80);
  document.querySelectorAll('.rv').forEach(r=>r.onclick=()=>r.classList.toggle('open'));
  $('#re').onclick=()=>{i=0;ans=[];times=[];startTime=Date.now();show()};
  if($('#pv'))$('#pv').onclick=preview;
  if($('#of'))idb.get(communityId,'quizzes').then(x=>{if(x){$('#of').textContent='Saved for offline ✓';$('#of').disabled=true}else $('#of').onclick=()=>saveOffline($('#of'))}).catch(()=>{});
  $('#hm').onclick=()=>location.href='index.html';
}
$('#zm').onclick=()=>{$('#zm').style.display='none'};

// ---- deep links: community play (?play=id) or a saved set (?set=id)
(async()=>{
  if(jobId){await startLive();return}
  const playId=new URLSearchParams(location.search).get('play');
  if(playId){
    app.innerHTML=`<div class="view">${brand}<div style="text-align:center;padding-top:40px"><div class="spin"></div><p class="sub">Loading community test from the home server...</p></div></div>`;
    try{
      const r=await fetch(API+'/quizzes/'+playId,{signal:AbortSignal.timeout(25000)});
      const j=await r.json().catch(()=>null);
      if(!r.ok||!j||!j.quiz)throw Error('not found');
      set={id:j.id,title:j.quiz.title||j.title,latex:true,questions:j.quiz.questions};
      communityMode=true;communityId=j.id;pubCreated=j.created||'';
      if(j.source_pdf){try{const pr=await fetch(API+'/files/quizzes/'+j.id+'/'+j.source_pdf,{signal:AbortSignal.timeout(40000)});if(pr.ok)pdfBuf=await pr.arrayBuffer()}catch(e){}}
      fetch(API+'/quizzes/'+j.id+'/play',{method:'POST'}).catch(()=>{});
      i=0;ans=[];times=[];startTime=Date.now();show();return
    }catch(e){
      app.innerHTML=`<div class="view">${brand}<h1 style="font-size:22px">Could not load that test</h1><p class="sub">The home server may be offline, or the link is wrong.</p><div class="foot" style="position:static"><button class="btn" onclick="location.href='index.html'">Back to sets</button></div></div>`;
      return
    }
  }
  const dlId=new URLSearchParams(location.search).get('dl');
  if(dlId){
    try{
      const r=await idb.get(dlId,'quizzes');
      if(!r)throw Error('missing');
      set={id:r.id,title:r.quiz.title||r.title,latex:true,questions:r.quiz.questions};
      communityMode=true;isDl=true;communityId=r.id;
      if(r.pdf)pdfBuf=await r.pdf.arrayBuffer();
      if(navigator.onLine)fetch(API+'/quizzes/'+r.id+'/play',{method:'POST'}).catch(()=>{});
      i=0;ans=[];times=[];startTime=Date.now();show();return
    }catch(e){
      app.innerHTML=`<div class="view">${brand}<h1 style="font-size:22px">Saved test not found</h1><p class="sub">It may have been removed from this browser.</p><div class="foot" style="position:static"><button class="btn" onclick="location.href='index.html'">Back to sets</button></div></div>`;
      return
    }
  }
  const id=new URLSearchParams(location.search).get('set');
  if(id){
    try{
      const s=JSON.parse(localStorage.getItem('dq-custom-sets')||'[]').find(x=>x.id===id);
      if(s){set=s;try{const b=await idb.get(id,'pdfs');if(b)pdfBuf=await b.arrayBuffer()}catch(e){}
        app.innerHTML=`<div class="view">${brand}<div style="text-align:center;padding-top:40px"><div class="spin"></div><p class="sub">Loading your paper...</p></div></div>`;
        i=0;ans=[];times=[];startTime=Date.now();show();return}
    }catch(e){}
  }
  uploadView();
})();
</script></body></html>
